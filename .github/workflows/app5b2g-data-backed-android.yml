name: App 5B-2H account handoff native gate

on:
  workflow_dispatch:
  push:
    branches:
      - product-13-assessment-contact-us-units-content-depth
    paths:
      - "apps/mobile/**"
      - "scripts/app5b2g/**"
      - "supabase/**"
      - ".github/workflows/app5b2g-data-backed-android.yml"

permissions:
  contents: read

concurrency:
  group: app5b2g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-data-backed-gate:
    name: Current APK + isolated backend + native journey
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      TEST_ENVIRONMENT: "true"
      PRODUCTION_SUPABASE_REF: svtmyxbjlbfmtysqqqwt
      EXPO_PUBLIC_ENVIRONMENT: staging
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3000
      EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
      EXPO_PUBLIC_ENABLE_ASSESSMENT_SCAFFOLD: "true"
      EXPO_PUBLIC_PROGRESS_V1_ENABLED: "false"
      EXPO_PUBLIC_NATIVE_JOURNEY_DIAGNOSTICS: "true"
      STHENO_ANDROID_APP_ID: com.sthenofitness.app
      STHENO_E2E_EMAIL: app5b2g-${{ github.run_id }}@example.test
      STHENO_E2E_PASSWORD: Stheno-CI-Only-2026!
      STHENO_E2E_EVIDENCE: artifacts/app5b2h/android
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Verify canonical E2E fixture and product invariants
        run: |
          node scripts/app5b2g/verify-fixture.mjs
          pnpm exec vitest run src/platform/contracts/exercise-baseline.test.ts src/platform/server/workout-operations.test.ts
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile test

      - name: Prove disposable Supabase target
        shell: bash
        run: |
          set -euo pipefail
          local_ref="$(awk -F '"' '/^project_id/ { print $2; exit }' supabase/config.toml)"
          test -n "$local_ref"
          test "$local_ref" != "$PRODUCTION_SUPABASE_REF"
          if env | grep -Eq '^(NEXT_PUBLIC_)?SUPABASE_(URL|KEY|SERVICE_ROLE_KEY)='; then
            echo "Production-shaped Supabase credentials must not enter this job." >&2
            exit 1
          fi

      - name: Start isolated Supabase/Auth/Storage and apply current migrations
        run: supabase start

      - name: Export masked local service configuration
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          : "${API_URL:?missing API_URL}"
          : "${DB_URL:?missing DB_URL}"
          : "${SERVICE_ROLE_KEY:?missing SERVICE_ROLE_KEY}"
          : "${PUBLISHABLE_KEY:?missing PUBLISHABLE_KEY}"
          for secret in "$SERVICE_ROLE_KEY" "$PUBLISHABLE_KEY"; do echo "::add-mask::$secret"; done
          {
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "POSTGRES_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Run isolated ownership and claim security matrix
        run: |
          supabase test db supabase/tests/app47_two_user_security.sql
          supabase test db supabase/tests/app5a_workout_atomicity.sql
          supabase test db supabase/tests/app5b1_protocol_integration.sql
          supabase test db supabase/tests/app5b1r_durable_outbox.sql

      - name: Start real STHENO API and prove capability behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/app5b2h/backend
          nohup pnpm dev --hostname 0.0.0.0 > artifacts/app5b2h/backend/next.log 2>&1 &
          echo $! > artifacts/app5b2h/backend/next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > artifacts/app5b2h/backend/health.json; then break; fi
            if [ "$attempt" = 90 ]; then cat artifacts/app5b2h/backend/next.log; exit 1; fi
            sleep 2
          done
          STHENO_API_BASE_URL=http://127.0.0.1:3000 node scripts/app5b2g/backend-negative.mjs

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Generate current Android project
        shell: bash
        run: |
          pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: app5b2g-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            app5b2g-gradle-${{ runner.os }}-

      - name: Build fresh APK from checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/app5b2h/android
          (cd apps/mobile/android && ./gradlew --no-daemon --build-cache assembleDebug)
          apk="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" artifacts/app5b2h/android/stheno-current-debug.apk
          sha256sum artifacts/app5b2h/android/stheno-current-debug.apk | tee artifacts/app5b2h/android/apk-sha256.txt
          git rev-parse HEAD | tee artifacts/app5b2h/android/source-commit.txt
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | head -1 | tee artifacts/app5b2h/android/apk-package.txt

      - name: Start Metro for current-source debug APK
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm --dir apps/mobile exec expo start --localhost --scheme stheno \
            > artifacts/app5b2h/android/metro.log 2>&1 &
          echo $! > artifacts/app5b2h/android/metro.pid
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/8081) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          cat artifacts/app5b2h/android/metro.log
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run genuine data-backed Android journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/app5b2g/run-android-e2e.sh

      - name: Sanitize and inventory evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/app5b2h/diagnostics
          printf 'api_health=' > artifacts/app5b2h/diagnostics/service-health.txt
          curl --silent --output /dev/null --write-out '%{http_code}\n' http://127.0.0.1:54321/auth/v1/health >> artifacts/app5b2h/diagnostics/service-health.txt || true
          docker ps -a > artifacts/app5b2h/diagnostics/docker-ps.txt 2>&1 || true
          git status --short > artifacts/app5b2h/diagnostics/git-status.txt
          find artifacts/app5b2h -type f -print | sort > artifacts/app5b2h/diagnostics/artifact-index.txt
          if rg -l "(eyJhbGci|sb_secret_|service_role|x-stheno-assessment-capability)" artifacts/app5b2h; then
            echo "Sensitive token material found in CI artifacts." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app5b2h-account-handoff-native-evidence
          path: artifacts/app5b2h
          retention-days: 14

